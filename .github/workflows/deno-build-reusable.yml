name: Build Deno package (reusable)

# Reusable workflow: builds deno jniLibs for ONE architecture inside the termux
# docker image, injects them into deno_package, and produces a signed per-ABI
# APK artifact. deno is 64-bit only (arm64-v8a, x86_64). Called by the per-arch
# workflows.

on:
  workflow_call:
    inputs:
      termux_arch:
        description: 'termux arch name (aarch64 | x86_64)'
        required: true
        type: string
      android_abi:
        description: 'android ABI (arm64-v8a | x86_64)'
        required: true
        type: string
    secrets:
      SIGNING_KEYSTORE_BASE64:
        description: 'base64-encoded release keystore (.jks). If unset, a debug key is used.'
        required: false
      SIGNING_STORE_PASSWORD:
        required: false
      SIGNING_KEY_ALIAS:
        required: false
      SIGNING_KEY_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # Pinned termux-packages commit -> reproducible tool versions
      # (python 3.14.6, nodejs 26.4.0, deno 2.9.2, ffmpeg 8.1.2).
      # Bump this SHA together with the app build.gradle versions to upgrade.
      TERMUX_PACKAGES_REF: 8782a533d25ee3030d500a39305eb57b9d0e460b
    steps:
      - name: Checkout (no LFS)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune -af || true
          df -h

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null

      - name: Clone termux-packages (pinned)
        run: |
          git init termux-packages
          cd termux-packages
          git remote add origin https://github.com/termux/termux-packages
          git fetch --depth 1 origin "$TERMUX_PACKAGES_REF"
          git checkout FETCH_HEAD

      - name: Stage build script
        run: |
          cp scripts/build-deno.sh termux-packages/build-deno.sh
          chmod +x termux-packages/build-deno.sh

      - name: Build deno jniLibs for ${{ inputs.android_abi }}
        working-directory: termux-packages
        run: |
          echo "Building deno for termux arch '${{ inputs.termux_arch }}' (ABI '${{ inputs.android_abi }}')"
          ./scripts/run-docker.sh ./clean.sh || true
          ./scripts/run-docker.sh ./build-deno.sh "${{ inputs.termux_arch }}"

      - name: Verify jniLibs output
        run: |
          OUT="termux-packages/output/jniLibs/${{ inputs.android_abi }}"
          echo "=== $OUT ==="
          ls -lh "$OUT"
          test -f "$OUT/libdeno.so"
          test -f "$OUT/libdeno.zip.so"

      - name: Inject jniLibs into deno_package
        run: |
          ABI="${{ inputs.android_abi }}"
          SRC="termux-packages/output/jniLibs/$ABI"
          DST="deno_package/app/src/main/jniLibs/$ABI"
          mkdir -p "$DST"
          cp -f "$SRC/libdeno.so"     "$DST/libdeno.so"
          cp -f "$SRC/libdeno.zip.so" "$DST/libdeno.zip.so"
          echo "=== $DST ==="
          ls -lh "$DST"

      - name: Configure signing
        working-directory: deno_package
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_STORE_PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS_KEY_PW: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "Using release keystore from secrets."
            printf '%s' "$KS_B64" | base64 -d > "$PWD/keystore.jks"
            {
              echo "signingConfig.storeFile=$PWD/keystore.jks"
              echo "signingConfig.storePassword=$KS_STORE_PW"
              echo "signingConfig.keyAlias=$KS_ALIAS"
              echo "signingConfig.keyPassword=$KS_KEY_PW"
            } > keystore.properties
          else
            echo "No SIGNING_KEYSTORE_BASE64 secret set -> release will be signed with the default debug key."
          fi

      - name: Build APK
        working-directory: deno_package
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate ${{ inputs.android_abi }} APK
        id: apk
        run: |
          ABI="${{ inputs.android_abi }}"
          DIR="deno_package/app/build/outputs/apk/release"
          APK="$(find "$DIR" -name "app-${ABI}-release.apk" | head -1)"
          if [ -z "$APK" ]; then
            echo "APK for $ABI not found. Directory contents:"; ls -R "$DIR"; exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: deno-${{ inputs.android_abi }}-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90
          compression-level: 0

      - name: Upload raw jniLibs (bonus)
        uses: actions/upload-artifact@v4
        with:
          name: deno-${{ inputs.android_abi }}-jnilibs
          path: |
            termux-packages/output/jniLibs/${{ inputs.android_abi }}/libdeno.so
            termux-packages/output/jniLibs/${{ inputs.android_abi }}/libdeno.zip.so
          retention-days: 90
          compression-level: 0

      - name: Summary
        run: |
          {
            echo "## Deno package built 🦕"
            echo ""
            echo "- **ABI:** \`${{ inputs.android_abi }}\`  (termux \`${{ inputs.termux_arch }}\`)"
            echo "- **APK artifact:** \`deno-${{ inputs.android_abi }}-apk\`"
            echo "- **jniLibs artifact:** \`deno-${{ inputs.android_abi }}-jnilibs\`"
          } >> "$GITHUB_STEP_SUMMARY"
